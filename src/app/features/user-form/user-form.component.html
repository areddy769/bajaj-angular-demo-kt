<div>


  <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
    <div class="form-grid">
      <div class="form-group">
        <label>First Name *</label>
        <input formControlName="firstName" placeholder="Enter first name" />
      </div>

      <div class="form-group">
        <label>Last Name *</label>
        <input formControlName="lastName" placeholder="Enter last name" />
      </div>

      <div class="form-group">
        <label>DOB</label>
        <input type="date" formControlName="dob" />
      </div>

      <div class="form-group">
        <label>City</label>
        <input formControlName="city" placeholder="Enter city" />
      </div>

      <div class="form-group">
        <label>Mobile</label>
        <input formControlName="mobile" placeholder="Enter mobile number" />
      </div>

      <div class="form-group">
        <label>Email *</label>
        <input type="email" formControlName="email" placeholder="Enter email address" />
      </div>

      <!-- Hide Password field when in editMode -->
      <div class="form-group" *ngIf="!editMode">
        <label>Password *</label>
        <input type="password" formControlName="password" placeholder="Enter password" />
      </div>
    </div>

    <button type="submit" class="btn btn-primary" [disabled]="userForm.invalid">
      {{ editMode ? 'Update User' : 'Submit User' }}
    </button>
  </form>
</div>
