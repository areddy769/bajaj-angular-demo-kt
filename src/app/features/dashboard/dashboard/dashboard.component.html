<div class="dashboard-container">

  <div class="dashboard-header">
    <h1>Dashboard</h1>
    <p>Customer Portal Overview</p>
  </div>

  <div *ngIf="loading" class="loading">
    Loading dashboard...
  </div>

  <div *ngIf="errorMessage" class="error">
    {{ errorMessage }}
  </div>

  <div *ngIf="!loading && !errorMessage" class="cards">

    <div class="card">
      <h3>Total Customers</h3>
      <p>{{ totalCustomers }}</p>
    </div>

    <div class="card">
      <h3>Active Customers</h3>
      <p>{{ activeCustomers }}</p>
    </div>

    <div class="card">
      <h3>Inactive Customers</h3>
      <p>{{ inactiveCustomers }}</p>
    </div>

    <div class="card">
      <h3>Total Users</h3>
      <p>{{ totalUsers }}</p>
    </div>

  </div>

</div>
