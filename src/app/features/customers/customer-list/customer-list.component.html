<h2>Customers</h2>
<p class="page-sub">Search, filter, and manage customer records. Deleting requires ADMIN.</p>

<div class="toolbar">
  <button type="button" routerLink="/customers/new">+ Add Customer</button>
</div>

<form class="filters" [formGroup]="filterForm" (ngSubmit)="applyFilters()">
  <input type="search" formControlName="search" placeholder="Search name, email, mobile…" aria-label="Search customers" />
  <select formControlName="status" aria-label="Filter by status">
    <option value="">All statuses</option>
    <option value="ACTIVE">Active</option>
    <option value="INACTIVE">Inactive</option>
  </select>
  <select formControlName="customerType" aria-label="Filter by type">
    <option value="">All types</option>
    <option value="INDIVIDUAL">Individual</option>
    <option value="BUSINESS">Business</option>
  </select>
  <input type="text" formControlName="city" placeholder="City" aria-label="Filter by city" />
  <button type="submit">Filter</button>
  <button type="button" class="secondary" (click)="clearFilters()">Clear</button>
</form>

<app-error-message [message]="error" retryText="Retry" (retry)="load(pagination.page)"></app-error-message>

<div class="table-wrap" *ngIf="loading">
  <div class="skeleton sk-row" *ngFor="let i of [1,2,3,4,5,6]"></div>
</div>

<table class="data-table" *ngIf="!loading && !error && customers.length">
  <thead>
    <tr>
      <th><button class="sort" (click)="toggleSort('firstName')">Name <span class="tri" [class.up]="isSorted('firstName')&&sortOrder==='asc'" [class.down]="isSorted('firstName')&&sortOrder==='desc'" *ngIf="isSorted('firstName')" aria-hidden="true"></span></button></th>
      <th>Email</th>
      <th>Mobile</th>
      <th>City</th>
      <th><button class="sort" (click)="toggleSort('status')">Status <span class="tri" [class.up]="isSorted('status')&&sortOrder==='asc'" [class.down]="isSorted('status')&&sortOrder==='desc'" *ngIf="isSorted('status')" aria-hidden="true"></span></button></th>
      <th><button class="sort" (click)="toggleSort('createdAt')">Created <span class="tri" [class.up]="isSorted('createdAt')&&sortOrder==='asc'" [class.down]="isSorted('createdAt')&&sortOrder==='desc'" *ngIf="isSorted('createdAt')" aria-hidden="true"></span></button></th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let c of customers">
      <td><strong>{{ c | fullName }}</strong></td>
      <td>{{ c.email }}</td>
      <td>{{ c.mobile }}</td>
      <td>{{ c.city }}</td>
      <td><app-status-badge [status]="c.status"></app-status-badge></td>
      <td>{{ c.createdAt | date: 'mediumDate' }}</td>
      <td class="actions">
        <button type="button" class="link" (click)="view(c.id)">View</button>
        <button type="button" class="link" (click)="edit(c.id)">Edit</button>
        <button type="button" class="link danger" *ngIf="auth.hasRole('ADMIN')" (click)="remove(c)">Delete</button>
      </td>
    </tr>
  </tbody>
</table>

<app-empty-state
  *ngIf="!loading && !error && !customers.length"
  title="No customers found."
  hint="Try a different search or add a new customer.">
</app-empty-state>

<app-pagination
  [page]="pagination.page"
  [totalPages]="pagination.totalPages"
  [totalItems]="pagination.totalItems"
  (pageChange)="load($event)">
</app-pagination>
