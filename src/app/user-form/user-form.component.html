<div class="main">

    <div style="max-width: 500px; margin: 20px auto; font-family: sans-serif;">
  <h2>{{ isEditMode ? 'Edit User' : 'Add User' }}</h2>

  <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
    
    
    <div style="margin-bottom: 15px;">
      <label>First Name *</label><br />
      <input type="text" formControlName="firstName" style="width: 100%; padding: 8px;" />
      <div *ngIf="isFieldInvalid('firstName')" style="color: red; font-size: 12px; margin-top: 4px;">
        First Name is required.
      </div>
    </div>

    <div style="margin-bottom: 15px;">
      <label>Last Name *</label><br />
      <input type="text" formControlName="lastName" style="width: 100%; padding: 8px;" />
      <div *ngIf="isFieldInvalid('lastName')" style="color: red; font-size: 12px; margin-top: 4px;">
        Last Name is required.
      </div>
    </div>

    <div style="margin-bottom: 15px;">
      <label>DOB</label><br />
      <input type="date" formControlName="dob" style="width: 100%; padding: 8px;" />
    </div>

    <div style="margin-bottom: 15px;">
      <label>City</label><br />
      <input type="text" formControlName="city" style="width: 100%; padding: 8px;" />
    </div>

    <div style="margin-bottom: 15px;">
      <label>Mobile</label><br />
      <input type="text" formControlName="mobile" style="width: 100%; padding: 8px;" />
    </div>

    <div style="margin-bottom: 15px;">
      <label>Email *</label><br />
      <input type="email" formControlName="email" style="width: 100%; padding: 8px;" />
      <div *ngIf="isFieldInvalid('email')" style="color: red; font-size: 12px; margin-top: 4px;">
        <span *ngIf="userForm.get('email')?.hasError('required')">Email is required.</span>
        <span *ngIf="userForm.get('email')?.hasError('email')">Please enter a valid email address.</span>
      </div>
    </div>

    <div style="margin-bottom: 15px;">
      <label>Password {{ isEditMode ? '(Optional)' : '*' }}</label><br />
      <input type="password" formControlName="password" style="width: 100%; padding: 8px;" />
      <div *ngIf="isFieldInvalid('password')" style="color: red; font-size: 12px; margin-top: 4px;">
        Password is required.
      </div>
    </div>

    <div style="margin-top: 20px;">
      <button 
        type="submit" 
        [disabled]="userForm.invalid" 
        style="padding: 10px 20px; cursor: pointer;">
        {{ isEditMode ? 'Update' : 'Submit' }}
      </button>

      <button 
        type="button" 
        (click)="onCancel()" 
        style="padding: 10px 20px; margin-left: 10px; cursor: pointer;">
        Cancel
      </button>
    </div>

  </form>
</div>
</div>
