<div class="customer-form-container">

  <div class="form-header">
    <h2>{{ editMode ? 'Edit Customer' : 'Add Customer' }}</h2>
    <p>{{ editMode ? 'Update customer details' : 'Enter customer details' }}</p>
  </div>

  <div *ngIf="errorMessage" class="error-message">
    {{ errorMessage }}
  </div>

  <form [formGroup]="customerForm" (ngSubmit)="onSubmit()">

<div class="form-row">

  <div class="form-group">
    <label>First Name</label>
    <input
      type="text"
      formControlName="firstName"
      placeholder="Enter first name">

    <small
      *ngIf="customerForm.get('firstName')?.touched &&
             customerForm.get('firstName')?.invalid">
      First name is required.
    </small>
  </div>

  <div class="form-group">
    <label>Last Name</label>
    <input
      type="text"
      formControlName="lastName"
      placeholder="Enter last name">

    <small
      *ngIf="customerForm.get('lastName')?.touched &&
             customerForm.get('lastName')?.invalid">
      Last name is required.
    </small>
  </div>

</div>

<div class="form-row">

  <div class="form-group">
    <label>Email</label>
    <input
      type="email"
      formControlName="email"
      placeholder="Enter email">

    <small
      *ngIf="customerForm.get('email')?.touched &&
             customerForm.get('email')?.invalid">
      Please enter a valid email.
    </small>
  </div>

  <div class="form-group">
    <label>Mobile</label>
    <input
      type="text"
      formControlName="mobile"
      placeholder="Enter 10 digit mobile number">

    <small
      *ngIf="customerForm.get('mobile')?.touched &&
             customerForm.get('mobile')?.invalid">
      Enter a valid 10 digit mobile number.
    </small>
  </div>

</div>

<div class="form-row">

  <div class="form-group">
    <label>City</label>
    <input
      type="text"
      formControlName="city"
      placeholder="Enter city">

    <small
      *ngIf="customerForm.get('city')?.touched &&
             customerForm.get('city')?.invalid">
      City is required.
    </small>
  </div>

  <div class="form-group">
    <label>Customer Type</label>

    <select formControlName="customerType">
      <option value="">Select customer type</option>
      <option value="INDIVIDUAL">Individual</option>
      <option value="BUSINESS">Business</option>
    </select>

    <small
      *ngIf="customerForm.get('customerType')?.touched &&
             customerForm.get('customerType')?.invalid">
      Customer type is required.
    </small>
  </div>

</div>

<div class="form-row">

  <div class="form-group">
    <label>Status</label>

    <select formControlName="status">
      <option value="ACTIVE">Active</option>
      <option value="INACTIVE">Inactive</option>
    </select>
  </div>

</div>

<div class="form-actions">

  <button
    type="button"
    class="cancel-btn"
    (click)="cancel()">
    Cancel
  </button>

  <button
    type="submit"
    class="submit-btn"
    [disabled]="loading">

    {{ loading ? 'Saving...' : (editMode ? 'Update Customer' : 'Add Customer') }}

  </button>

</div>


  </form>

</div>
